const core=new T.Mesh(new T.OctahedronGeometry(.55,0),new T.MeshBasicMaterial({color:0xff66ff,transparent:true,opacity:.5}));portal.add(core);

document.getElementById('enter').onclick=slowToLogin;
(function a(now){const dt=Math.min((now-last)/1000,.05);last=now;const elapsed=stopping?Math.min(1,(now-stopAt)/1900):0;const speed=stopping?Math.pow(1-elapsed,3):1;window.sceneIntro.speed=speed;sceneTime+=dt*speed;const t=sceneTime,step=dt*60*speed;
portal.children.forEach((m,i)=>{m.rotation.z=t*(.2+i*.07)*(i%2?-1:1);m.rotation.y=Math.sin(t*.5+i)*.4});gem.rotation.set(t*.4,t*.6,0);core.rotation.y=-t;

if(entered&&!stopping)warp=Math.min(warp+.03*step,6);const sp=(entered?warp*2:.4)*step,p=g.attributes.position.array;for(let i=2;i<N*3;i+=3){p[i]+=sp;if(p[i]>10)p[i]-=1200}g.attributes.position.needsUpdate=true;
stars.material.size=.9+warp*.5;if(entered){C.position.z+=(-2-C.position.z)*.02*step;C.fov+=(110-C.fov)*.02*step;C.updateProjectionMatrix()}
C.position.x+=(mx*2-C.position.x)*.05*step;C.position.y+=(-my*2-C.position.y)*.05*step;C.lookAt(0,0,-10);R.render(S,C);

})(performance.now());
