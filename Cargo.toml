# SPDX-License-Identifier: Apache-2.0
[package]
name="ans-core"
version="0.2.0"
edition="2021"
license="Apache-2.0"
description="Apache-2.0 local ANS core: signed chat, book, delegation and MCP"
[dependencies]
serde={version="1",features=["derive"]}
fs4="0.8"
anyhow="1"
serde_json="1"
sha2="0.10"
sha3="0.10"
hex="0.4"
rand="0.8"
base64="0.22"
toml="0.8"
ans-xmss={path="vendor/ans-xmss"}
popchain-cli={path="vendor/popchain-cli"}
ans-dict={path="crates/ans-dict"}

[[bin]]
name="ans"
path="src/main.rs"

[workspace]
members = [".", "crates/ans-dict"]
default-members = [".", "crates/ans-dict"]
exclude = ["vendor/ans-xmss", "vendor/popchain-cli"]
resolver = "2"
