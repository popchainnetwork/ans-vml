<!doctype html><html lang="pl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ANS · Twój świat</title><style>
*{box-sizing:border-box}body{margin:0;background:#030b12;color:#d9faff;font:16px system-ui;height:100dvh;overflow:hidden}header{padding:20px;color:#75ffff}button,input{font:inherit}button{min-height:48px;border:1px solid #397078;border-radius:18px;background:#0b1b28;color:inherit;padding:10px 16px;cursor:pointer}#map{position:absolute;inset:80px 12px 30px;background:radial-gradient(ellipse at center,#0b353d99,transparent 65%);border-radius:50%;border:1px solid #12404c}#hint{text-align:center;color:#a9dbe5}.node{position:absolute;transform:translate(-50%,-50%);display:grid;gap:6px;place-items:center}.node.self{left:50%;top:48%;border-radius:50%;width:92px;height:92px;box-shadow:0 0 50px #32e8ee55;background:#12303e}.friend{left:22%;top:30%}.portal{left:76%;top:25%}#plus{position:fixed;bottom:20px;left:20px}#chat{position:fixed;inset:120px 12px 20px;background:#08131ff5;border:1px solid #48a8ad;border-radius:22px;padding:14px;display:flex;flex-direction:column;box-shadow:0 20px 80px #000}#chat[hidden],dialog:not([open]){display:none}#chatHead{display:flex;justify-content:space-between;align-items:center}#messages{overflow:auto;flex:1;padding:14px 0}.bubble{max-width:88%;padding:12px;margin:8px 0;border-radius:18px;background:#15313e;white-space:pre-wrap;overflow-wrap:anywhere}.lock{min-height:32px;padding:2px 8px;border:none;background:none}form{display:flex;gap:8px}input{min-width:0;flex:1;min-height:48px;border-radius:16px;background:#071019;border:1px solid #376571;color:inherit;padding:12px}dialog{max-width:min(92vw,650px);max-height:80dvh;overflow:auto;background:#091827;color:inherit;border:1px solid #52aeb0;border-radius:20px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}#notice{font-size:13px;color:#adced4;min-height:20px}@media(min-width:700px){#map{inset:100px 15vw 40px}#chat{inset:120px max(18px,calc((100vw - 680px)/2)) 40px}}
</style><header>bitxbit / ANS <small>· otwarty rdzeń</small></header><p id="hint">Kliknij kogoś, żeby pogadać</p><main id="map"></main><button id="plus" aria-label="Dodaj kontakt">＋</button><section id="chat" hidden><div id="chatHead"><strong id="chatName"></strong><button id="close" aria-label="Zamknij rozmowę">×</button></div><div id="messages"></div><p id="notice"></p><form id="send"><input id="text" aria-label="Wiadomość" placeholder="Napisz…" required><button>Wyślij</button></form></section><dialog id="auditDialog"><h3>🔒 Podpisane</h3><pre id="auditHops"></pre><button id="back">Wróć</button></dialog><script>
const OWNER=window.ANS_CUSTODIAN||location.pathname.split('/').pop(),$=id=>document.getElementById(id);let state,current=null;
async function api(body){const r=await fetch('/api/exploit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...body,custodian:OWNER})});const v=await r.json();if(!v.ok)throw Error(v.error||'Spróbuj ponownie');return v}
function node(label,cls,left,top,callback){const b=document.createElement('button');b.className='node '+cls;b.style.left=left;b.style.top=top;b.textContent=label;b.onclick=callback;$('map').append(b)}
async function refresh(){state=await api({op:'state'});$('map').replaceChildren();node('⚛ '+OWNER,'self','50%','48%',()=>{});state.contacts.forEach((w,i)=>node(w.replace('.ans',''),'friend',(20+(i%3)*24)+'%',(28+Math.floor(i/3)*20)+'%',()=>openChat(w,false)));(state.public_channels||[]).forEach((c,i)=>node('#'+c.name,'portal',(76-(i%2)*22)+'%',(22+Math.floor(i/2)*20)+'%',()=>openChat(c.id,true)))}
async function openChat(id,channel){try{current={id,channel};if(channel)await api({op:'channel_join',channel:id});await refresh();$('chatName').textContent=channel?id.split('/').pop():id;$('chat').hidden=false;let messages=state.messages;if(channel){const v=await api({op:'channel_read',channel:id});messages=v.messages||[]}else messages=messages.filter(m=>(m.from===id&&m.to===OWNER+'.ans')||(m.to===id&&m.from===OWNER+'.ans'));$('messages').replaceChildren();for(const m of messages){const b=document.createElement('div');b.className='bubble';b.append(document.createTextNode(m.text));const lock=document.createElement('button');lock.className='lock';lock.textContent='🔒';lock.onclick=async()=>{const v=await api({op:'provenance',message_id:m.id});$('auditHops').textContent=JSON.stringify(v.hops,null,2);$('auditDialog').showModal()};b.append(lock);$('messages').append(b)}$('messages').scrollTop=$('messages').scrollHeight}catch(e){$('notice').textContent=e.message}}
$('send').onsubmit=async e=>{e.preventDefault();try{const b=current.channel?{op:'channel_send',channel:current.id,text:$('text').value}:{op:'dm_send',to:current.id,text:$('text').value};await api(b);$('text').value='';await openChat(current.id,current.channel)}catch(e){$('notice').textContent=e.message}};$('close').onclick=()=>{$('chat').hidden=true};$('back').onclick=()=>$('auditDialog').close();$('plus').onclick=async()=>{const w=prompt('Słowo znajomego, np. test.ans');if(w){try{await api({op:'contact_add',word:w});await refresh()}catch(e){alert(e.message)}}};refresh().catch(e=>$('hint').textContent=e.message);
</script></html>
