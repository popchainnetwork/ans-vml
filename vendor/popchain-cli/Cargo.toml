[package]
name = "popchain-cli"
version = "0.6.0"
edition = "2021"
license = "MIT"
description = "PopChain L1 kernel v0.6: deterministic PoP chain + fork graph + NDJSON P2P"
readme = "README.md"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

sha2 = "0.10"
blake3 = "1.5"
hex = "0.4"
base64 = "0.22"

fs4 = "0.8"

tokio = { version = "1.39", features = ["rt-multi-thread", "macros", "net", "time", "io-util", "sync"] }

rand = "0.8"

[dev-dependencies]
tempfile = "3.10"
